{

"name": "Build APK",

"on": {"push": {}, "workflow_dispatch": {}},

"permissions": {"contents": "write"},

"jobs": {"build": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"uses": "actions/setup-java@v5", "with": {"distribution": "temurin", "java-version": 17}}, {"uses": "gradle/actions/setup-gradle@v4", "with": {"gradle-version": "8.9"}}, {"name": "Accept licenses", "run": "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true"}, {"name": "Unpack", "run": "unzip -q AiAgent.zip"}, {"name": "Build", "working-directory": "AiAgent", "run": "gradle :app:assembleRelease --no-daemon --stacktrace"}, {"name": "Prepare", "run": "cp AiAgent/app/build/outputs/apk/release/app-release.apk AiAgent.apk"}, {"uses": "actions/upload-artifact@v4", "with": {"name": "AiAgent-apk", "path": "AiAgent.apk"}}, {"name": "Release", "env": {"GH_TOKEN": "${{ github.token }}"}, "run": "gh release delete latest --yes --cleanup-tag || true; gh release create latest AiAgent.apk --title 'AI Agent' --notes 'Download AiAgent.apk' --latest"}]}}

}
